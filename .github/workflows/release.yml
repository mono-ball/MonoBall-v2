name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  analyze:
    name: Code Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          global-json-file: "./global.json"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cache dotnet tools
        uses: actions/cache@v4
        with:
          path: ~/.dotnet/tools
          key: ${{ runner.os }}-tools-${{ hashFiles('**/dotnet-tools.json') }}
          restore-keys: |
            ${{ runner.os }}-tools-

      - name: Restore Tools
        run: dotnet tool restore

      - name: Run Code Analysis (Fail on Warnings)
        run: dotnet run --project .build/MonoBall.Build/MonoBall.Build.csproj --configuration=Release --target=Analyze --treat-warnings-as-errors

  build-and-publish:
    name: Build and Publish
    runs-on: ${{ matrix.os }}
    needs: analyze
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          global-json-file: "./global.json"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cache dotnet tools
        uses: actions/cache@v4
        with:
          path: ~/.dotnet/tools
          key: ${{ runner.os }}-tools-${{ hashFiles('**/dotnet-tools.json') }}
          restore-keys: |
            ${{ runner.os }}-tools-

      - name: Restore Tools
        run: dotnet tool restore

      - name: Build and Publish
        run: dotnet run --project .build/MonoBall.Build/MonoBall.Build.csproj --configuration=Release --target=Publish

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MonoBall-${{ matrix.os }}
          path: |
            MonoBall/MonoBall.DesktopGL/bin/Release/net10.0/publish/**
            Mods/**

  generate-docs:
    name: Generate API Documentation
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          global-json-file: "./global.json"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cache dotnet tools
        uses: actions/cache@v4
        with:
          path: ~/.dotnet/tools
          key: ${{ runner.os }}-tools-${{ hashFiles('**/dotnet-tools.json') }}
          restore-keys: |
            ${{ runner.os }}-tools-

      - name: Restore Tools
        run: dotnet tool restore

      - name: Build (Required for Docs Generation)
        run: dotnet run --project .build/MonoBall.Build/MonoBall.Build.csproj --configuration=Release --target=Build

      - name: Generate API Documentation
        run: dotnet run --project .build/MonoBall.Build/MonoBall.Build.csproj --configuration=Release --target=GenerateApiDocs

      - name: Upload API Documentation
        uses: actions/upload-artifact@v4
        with:
          name: api-documentation
          path: docs/api/**

      - name: Commit and Push API Documentation
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/api/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: Update API documentation for release ${{ github.event.release.tag_name }}"
            git push
          fi
